<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Phối Màu Đơn Tông Mới</title>
    <style>
        /* Thiết lập chung và màu chữ mặc định là màu đen (Bước 6) */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #000000;
            /* Bước 2: Màu nền chuyển thành màu bậc 4 (#FF857D) */
            background-color: #FF857D; 
        }

        header {
            background-color: #FF3B30; /* Màu bậc 1 */
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        /* Bước 3: Thay đổi màu nền phần ON SALE / PREVIEW (dùng màu bậc 2: #FF5247) */
        .badge-sale {
            background-color: #FF5247;
            color: #ffffff;
            padding: 5px 10px;
            font-weight: bold;
            display: inline-block;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        /* Bước 4: Đổi màu nền phần nội dung thành màu bậc 7 (#FFD1CE) */
        .content {
            background-color: #FFD1CE;
            color: #000000; /* Giữ màu đen vì nền khá nhạt */
            padding: 30px;
            margin: 20px;
            border-radius: 8px;
        }

        /* Bước 5: Đổi màu nền phần footer thành màu bậc 9 (#FFEBEA) */
        footer {
            background-color: #FFEBEA;
            color: #000000;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Logo / Tiêu đề chính</h1>
        <p>Giao diện được phối lại với tông màu đơn tông mới</p>
    </header>

    <div class="content">
        <span class="badge-sale">ON SALE / PREVIEW</span>
        <h2>Nội dung trang web</h2>
        <p>Phần này nằm trên nền bậc 7 với chữ màu đen giúp dễ đọc và tạo điểm nhấn hài hòa cho tổng thể trang.</p>
    </div>

    <footer>
        <p>&copy; 2026 - Bản quyền thuộc về trang web của bạn.</p>
    </footer>

</body>
</html>
